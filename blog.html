---
layout: default
title: Blogs
permalink: /blog/
redirect_from: /archive/
---

<div class="home-grid archive-layout">
    <aside class="home-intro">
        <header>
            <h1 class="intro-name">blogs</h1>
            <p class="intro-subtitle mono">writing, notes & build logs</p>
        </header>
    </aside>

    <main class="home-content">
        <section class="home-content-block">
            <h2 class="home-section-title mono">All Posts</h2>
            <div id="all-posts">
                {% for item in site.posts %}
                    {% unless item.external_link %}
                        {% include post-card.html item=item %}
                    {% endunless %}
                {% endfor %}
            </div>
        </section>
    </main>
</div>
